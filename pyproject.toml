[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llama-index-tools-tempguru"
version = "0.1.0"
description = "LlamaIndex tools for TempGuru event staffing: city coverage, W-2 rate ranges, booking lead times, and state labor compliance for 345+ US/CA cities, plus opt-in quote submission. No API key required."
authors = [{ name = "TempGuru (Temporary Assistance Guru, Inc.)", email = "megan@tempguru.co" }]
requires-python = ">=3.10,<4.0"
readme = "README.md"
license = "MIT"
maintainers = [{ name = "tempguru-co" }]
keywords = [
    "event staffing",
    "events",
    "staffing",
    "temp staff",
    "brand ambassadors",
    "trade show",
    "conference",
    "labor compliance",
    "agent tools",
]
dependencies = [
    "tempguru>=0.2.0,<1",
    "llama-index-core>=0.13.0,<0.15",
]

[project.urls]
Homepage = "https://tempguru.co"
Documentation = "https://tempguru.co/ai"
Source = "https://github.com/Tempguru-co/llama-index-tools-tempguru"
"API Reference (OpenAPI)" = "https://mcp.tempguru.co/openapi.json"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.11",
]

[tool.codespell]
check-filenames = true
check-hidden = true
skip = "*.csv,*.html,*.json,*.jsonl,*.pdf,*.txt,*.ipynb"

[tool.hatch.build.targets.sdist]
include = ["llama_index/"]
exclude = ["**/BUILD"]

[tool.hatch.build.targets.wheel]
include = ["llama_index/"]
exclude = ["**/BUILD"]

[tool.llamahub]
contains_example = true
import_path = "llama_index.tools.tempguru"

[tool.llamahub.class_authors]
TempGuruToolSpec = "tempguru-co"
